<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заметки · Календарь</title>
  <!-- Тема — до первой отрисовки, поэтому обычным скриптом прямо здесь, а не в
       модуле: модули выполняются позже, и тёмная тема успевала бы мигнуть
       белым. Ключ и список тем те же, что в src/settings/themeSetting.js. -->
  <script>
    try {
      var theme = localStorage.getItem("app:theme");
      if (["light", "dark", "sage", "sepia", "midnight", "sand"].indexOf(theme) !== -1) {
        document.documentElement.dataset.theme = theme;
      }
    } catch (error) {
      // localStorage недоступен (приватный режим и т.п.) — остаётся светлая тема.
    }
  </script>
  <!-- theme.css — первым: остальные файлы берут из него переменные. -->
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/icons.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/home.css">
  <link rel="stylesheet" href="styles/panels.css">
  <link rel="stylesheet" href="styles/editor.css">
  <link rel="stylesheet" href="styles/calendar.css">
  <link rel="stylesheet" href="styles/search.css">
  <link rel="stylesheet" href="styles/blockTagsBrowser.css">
  <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
  <main id="app-view" class="app-view">
    <!-- Сюда рендерится текущий раздел -->
  </main>

  <!-- Обычный (не module) скрипт — блокирует парсер и гарантированно
       выполняется раньше src/app.js, чтобы window.supabase уже был готов. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
